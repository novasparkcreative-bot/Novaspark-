<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaSpark CEO</title><style>body{font-family:system-ui;margin:0;background:#f4f6fa;color:#172033}main{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card,section{background:#fff;border:1px solid #e2e7ef;border-radius:14px;padding:18px}.num{font-size:30px;font-weight:750}.muted{color:#667085}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}input{padding:10px;border:1px solid #ccd3df;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div><h1>🤖 NovaSpark — Alex CEO</h1><div class="muted">Local acquisition & delivery control center</div></div><button onclick="load()">↻ Refresh</button></div><div id="stats" class="grid"></div><section><h2>Add Business</h2><div class="row"><input id="name" placeholder="Business name"><input id="website" placeholder="Website"><input id="industry" placeholder="Industry"><input id="location" placeholder="Location"><input id="contact" placeholder="Email / permitted contact"><input id="notes" placeholder="Notes"></div><div class="actions"><button onclick="addLead()">Add Lead</button></div><pre id="out"></pre></section><section><h2>Leads</h2><div id="leads" class="muted">Loading...</div></section><section><h2>Approvals</h2><div id="approvals" class="muted">Loading...</div></section></main><script>const out=document.getElementById('out');async function api(path,opt){const r=await fetch(path,opt);const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){try{const [l,a]=await Promise.all([api('/api/leads'),api('/api/approvals')]);const counts={Leads:l.leads.length,Qualified:l.leads.filter(x=>x.status==='qualified').length,Clients:0,'Pending Approvals':a.approvals.filter(x=>x.status==='pending').length};document.getElementById('stats').innerHTML=Object.entries(counts).map(([k,v])=>`<div class="card"><div class="muted">${k}</div><div class="num">${v}</div></div>`).join('');document.getElementById('leads').innerHTML=l.leads.length?l.leads.map(x=>`<div class="card" style="margin:8px 0"><b>${esc(x.business_name)}</b> · score ${x.score} · ${x.status}<br><span class="muted">${esc(x.industry||'')} ${esc(x.location||'')}</span><br><button onclick="qualify(${x.id})">Qualify</button><button onclick="draft(${x.id})">Outreach draft</button></div>`).join(''):'No leads yet';document.getElementById('approvals').innerHTML=a.approvals.length?a.approvals.map(x=>`<div class="card" style="margin:8px 0">#${x.id} · ${esc(x.action)} · <b>${x.status}</b>${x.status==='pending'?` <button onclick="decision(${x.id},'approved')">Approve</button><button onclick="decision(${x.id},'rejected')">Reject</button>`:''}</div>`).join(''):'No approvals';}catch(e){out.textContent=e.message}}async function addLead(){try{const d={business_name:name.value,website:website.value,industry:industry.value,location:location.value,contact:contact.value,notes:notes.value};out.textContent=JSON.stringify(await api('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),null,2);load()}catch(e){out.textContent=e.message}}async function qualify(id){try{out.textContent=JSON.stringify(await api('/api/leads/qualify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lead_id:id})}),null,2);load()}catch(e){out.textContent=e.message}}async function draft(id){const l=(await api('/api/leads')).leads.find(x=>x.id===id);try{out.textContent=JSON.stringify(await api('/api/outreach/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({business_name:l.business_name,industry:l.industry,website:l.website})}),null,2);load()}catch(e){out.textContent=e.message}}async function decision(id,status){try{out.textContent=JSON.stringify(await api('/api/approvals/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approval_id:id,status})}),null,2);load()}catch(e){out.textContent=e.message}}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();</script></body></html>
